name: TheaterExtras watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: theaterextras-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for new listings
        env:
          TE_ACCESS_TOKEN: ${{ secrets.TE_ACCESS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TE_EXCLUDE_REGIONS: 'Los Angeles'
          ALERT_NEW_SHOWTIMES: 'on'
          ALERT_TICKET_DROPS: 'on'
          AVAIL_COOLDOWN_HOURS: '2'
          MAX_INDIVIDUAL: '20'
          REPEATS: '20'
          SLEEP_SECONDS: '30'
          HEARTBEAT_HOURS: '168'
        run: python watch.py

      - name: Save state
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "theaterextras-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep 5
          done
          echo "Could not push state after 3 attempts."
          exit 1
